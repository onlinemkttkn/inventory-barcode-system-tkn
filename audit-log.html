<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Log</title>
  <link rel="stylesheet" href="./css/audit.css?v=1.0.2">
  <link rel="stylesheet" href="./css/navigation.css?v=5.14.2">
  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <link rel="stylesheet" href="./css/ui-operations-reports-audit.css?v=3.6.9">
  <link rel="stylesheet" href="./css/audit-details-ui.css?v=3.5.9-audit-ui-01">
  <!-- TKN Global Prompt Typography v4.7.0 -->
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
</head>
<body class="audit-page">
<main class="shell">
  <header class="top">
    <div>
      <h1>ประวัติการใช้งานระบบ</h1>
      <p>ตรวจสอบว่าใครทำอะไร เมื่อไร</p>
    </div>
    <a class="btn secondary" href="./dashboard.html">Dashboard</a>
  </header>

  <section class="card grid audit-filter-card">
    <label>ประเภทข้อมูล
      <select id="entityFilter">
        <option value="">ทั้งหมด</option>
        <option value="PRODUCT">สินค้า</option>
        <option value="STOCK_DOCUMENT">รับเข้า/เบิกจ่าย</option>
        <option value="TRANSFER_DOCUMENT">ใบโอน</option>
        <option value="STOCK_COUNT">ตรวจนับ</option>
        <option value="SALE">รายการขาย</option>
        <option value="SALE_RETURN">รายการคืนสินค้า</option>
        <option value="CASH_DRAWER">ลิ้นชักเงินสด</option>
        <option value="CASHIER_SHIFT">กะแคชเชียร์</option>
      </select>
    </label>

    <label>การทำรายการ
      <select id="actionFilter">
        <option value="">ทั้งหมด</option>
        <option value="CREATE">สร้าง</option>
        <option value="UPDATE">แก้ไข</option>
        <option value="DELETE">ลบ</option>
        <option value="SHIFT_OPEN">เปิดกะแคชเชียร์</option>
        <option value="SHIFT_CLOSE">ปิดกะแคชเชียร์</option>
        <option value="CASH_DRAWER_OPEN_SUCCESS">เปิดลิ้นชักสำเร็จ</option>
        <option value="CASH_DRAWER_OPEN_FAILED">เปิดลิ้นชักไม่สำเร็จ</option>
        <option value="CASH_DRAWER_OPEN_DENIED">ปฏิเสธการเปิดลิ้นชัก</option>
      </select>
    </label>

    <label>ค้นหา
      <input id="searchInput" placeholder="เลขเอกสาร สินค้า ผู้ใช้ หรือสาขา">
    </label>

    <label>วันที่เริ่ม
      <input id="dateFrom" type="date">
    </label>

    <label>วันที่สิ้นสุด
      <input id="dateTo" type="date">
    </label>

    <button id="refreshBtn" class="btn" type="button">โหลดข้อมูล</button>
  </section>

  <section class="card wrap audit-table-card">
    <table>
      <thead>
        <tr>
          <th>วันเวลา</th>
          <th>ผู้ใช้งาน</th>
          <th>การทำรายการ</th>
          <th>ประเภท</th>
          <th>รายการ</th>
          <th>สาขา</th>
          <th>รายละเอียด</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p id="message" class="msg"></p>
  </section>
</main>

<dialog id="auditDetailDialog" class="audit-detail-dialog">
  <div class="audit-dialog-shell">
    <header class="audit-dialog-head">
      <div>
        <h2 id="auditDetailTitle">รายละเอียดการทำรายการ</h2>
        <p id="auditDetailSummary"></p>
      </div>
      <button id="auditDetailClose" class="audit-dialog-close"
        type="button" aria-label="ปิด">×</button>
    </header>
    <div class="audit-dialog-body">
      <div id="auditDetailFields" class="audit-detail-fields"></div>
      <div class="audit-dialog-actions">
        <button id="auditCopyDetail" class="primary-action"
          type="button">คัดลอกรายละเอียด</button>
        <button id="auditToggleRaw"
          type="button">ดูข้อมูลต้นฉบับ</button>
      </div>
      <section id="auditRawPanel" class="audit-raw-panel" hidden>
        <pre id="auditRawJson"></pre>
      </section>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=1.0.2"></script>
<script src="./js/audit-log.js?v=3.5.9-audit-ui-01"></script>
  <script src="./js/tkn-safe-back.js?v=5.14.2"></script>
<script src="./js/navigation-newtab-final.js?v=5.14.2"></script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>สต็อกแยกสาขา</title>
  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/global-font.css?v=4.7.0">
  <link rel="stylesheet" href="./css/auth-stability.css?v=5.31.3">
  <link rel="stylesheet" href="./css/transfer.css?v=1.0.2">
  <link rel="stylesheet" href="./css/navigation.css?v=5.19.0">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <link rel="stylesheet" href="./css/inventory-final-ui.css?v=1.0.0">
  <link rel="stylesheet" href="./css/ui-modern-v5-19.css?v=5.19.0">
  <link rel="stylesheet" href="./css/app-shell-v5-19.css?v=5.31.3">
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="manifest" href="./manifest.webmanifest?v=5.20.4">
</head>
<body class="tkn-auth-loading" data-required-permission="inventory.view" data-loading-text="กำลังตรวจสอบสิทธิ์และโหลดสต็อกแยกสาขา...">
  <main class="shell">
    <header class="top">
      <h1>สต็อกแยกตามสาขา</h1>
      <a class="btn secondary" href="./dashboard.html">Dashboard</a>
    </header>

    <section class="card grid">
      <label>สาขา
        <select id="branch" aria-label="เลือกสาขา" disabled>
          <option value="">กำลังโหลดสาขา...</option>
        </select>
      </label>
      <label>ค้นหา
        <input id="search" autocomplete="off" placeholder="รหัสสินค้า ชื่อสินค้า หรือบาร์โค้ด" disabled>
      </label>
    </section>

    <section class="card wrap">
      <table>
        <thead>
          <tr><th>รหัส</th><th>สินค้า</th><th>บาร์โค้ด</th><th>คงเหลือ</th><th>หน่วย</th></tr>
        </thead>
        <tbody id="body"><tr><td colspan="5">กำลังตรวจสอบสิทธิ์...</td></tr></tbody>
      </table>
      <p id="message" class="msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js?v=3.4.0"></script>
  <!-- Critical dependency order: AuthGuard MUST load before branch-stock runtime. -->
  <script src="./js/auth-guard.js?v=5.31.3"></script>
  <script src="./js/branch-stock-v5-31-3.js?v=5.31.3"></script>
  <script src="./js/tkn-safe-back.js?v=5.19.0"></script>
  <script src="./js/app-shell-v5-19.js?v=5.31.3" defer></script>
</body>
</html>

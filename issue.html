<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="stylesheet" href="./css/navigation.css?v=5.14.2">

  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <link rel="stylesheet" href="./css/ui-operations-reports-audit.css?v=3.6.9">
  <link rel="stylesheet" href="./css/auth-stability.css?v=3.6.11">
  <link rel="stylesheet" href="./css/inventory-workspace.css?v=5.0.0">
  <link rel="stylesheet" href="./css/inventory-final-ui.css?v=1.0.0">
  <!-- TKN Global Prompt Typography v4.7.0 -->

  <!-- TKN Mobile App Shell v5.17.0 -->

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="TKN POS">

<body class="inventory-operation-page issue-page tkn-auth-loading" data-inventory-page="issue" data-loading-text="กำลังเปิดคลังสินค้า...">
<main class="shell">
  <header class="topbar">
    <div><p class="eyebrow">PHASE 07</p><h1>เบิก/จ่ายสินค้า</h1><p>เลือกสาขา ค้นหาหรือสแกนสินค้า แล้วตัดยอดออกจากสต็อกสาขา</p></div>
    <div class="button-row"><a class="btn secondary" href="./dashboard.html">Dashboard</a><a class="btn secondary" href="./transactions.html">ประวัติ</a></div>
  </header>

  <section class="card operation-search-card">
    <div class="grid-2">
      <label class="field">สาขาที่เบิกสินค้า
        <select id="branch" required disabled>
          <option value="">กำลังโหลดสาขา...</option>
        </select>
      </label>
      <label class="field">ชื่อผู้เบิก<input id="requesterName" required></label>
      <label class="field">แผนก<input id="department" placeholder="เช่น ฝ่ายขาย"></label>
      <label class="field">เลขอ้างอิง<input id="referenceNo" placeholder="REQ-0001"></label>
      <label class="field">หมายเหตุ<textarea id="notes" rows="2"></textarea></label>
    </div>
  </section>

  <section class="card">
    <h2>เพิ่มสินค้า</h2>
    <form id="searchForm" class="search-row operation-search-bar">
      <input id="searchInput" placeholder="ชื่อสินค้า รหัสสินค้า หรือบาร์โค้ด" autocomplete="off">
      <button class="btn primary" type="submit">ค้นหา</button>
      <button id="scanBtn" class="btn scan" type="button">สแกนกล้อง</button>
    </form>
    <div id="results" class="results"></div>
    <p id="searchMessage" class="message"></p>
  </section>

  <section class="card cart-card">
    <h2>รายการเบิก</h2>
    <div id="cartList" class="cart-list"></div>
    <div class="summary">
      <strong>รวม <span id="totalLines">0</span> รายการ / <span id="totalQty">0</span> หน่วย</strong>
      <button id="saveBtn" class="btn danger" type="button">บันทึกการเบิก</button>
    </div>
    <p id="actionMessage" class="message"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<script src="./js/inventory-common.js?v=3.6.10"></script>
<script type="module" src="./js/issue.js?v=5.0.0"></script>
  <script src="./js/tkn-safe-back.js?v=5.14.2"></script>
<script src="./js/navigation-newtab-final.js?v=5.14.2"></script>

  <script src="./js/mobile-app-shell-v5-17.js?v=5.17.0" defer></script>
</body>
</html>

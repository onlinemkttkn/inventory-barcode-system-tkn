<html lang="th">
<head>

  <link rel="stylesheet" href="./css/auth-stability.css?v=5.8.0">
  <link rel="stylesheet" href="./css/members.css?v=5.8.0">

<body class="tkn-auth-loading" data-loading-text="กำลังตรวจสอบสิทธิ์ประวัติคะแนน...">
<main class="shell">
  <header class="top">
    <div>
      <h1>ประวัติคะแนนสมาชิก</h1>
      <p id="scopeText" class="scope-text"></p>
    </div>
    <a class="btn secondary" href="./dashboard.html">Dashboard</a>
  </header>

  <section class="card">
    <form id="searchForm" class="row search-row">
      <select id="branchFilter" aria-label="กรองสาขา"></select>
      <input id="search" placeholder="เบอร์โทร ชื่อ หรือเลขสมาชิก">
      <button class="btn primary">ค้นหา</button>
    </form>
  </section>

  <section class="card wrap">
    <table>
      <thead>
        <tr><th>วันที่</th><th>สาขา</th><th>สมาชิก</th><th>ประเภท</th><th>คะแนน</th><th>ก่อน</th><th>หลัง</th><th>บิล</th><th>รายละเอียด</th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <p id="message" class="msg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=1.0.2"></script>

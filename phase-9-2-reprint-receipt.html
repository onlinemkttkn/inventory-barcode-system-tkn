<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TKN POS - พิมพ์ใบเสร็จย้อนหลัง</title>
  <link rel="stylesheet" href="./css/receipt-return.css?v=5.16.2">
  <link rel="stylesheet" href="./css/phase-9-2-reprint-receipt.css?v=5.16.2">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">

  <!-- TKN Mobile App Shell v5.17.0 -->
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="apple-touch-icon" href="./assets/icons/tkn-app-192.png">
  <link rel="manifest" href="./manifest.webmanifest?v=5.18.0">
  <link rel="stylesheet" href="./css/ui-modern-v5-18.css?v=5.18.0">
  <link rel="stylesheet" href="./css/mobile-app-shell-v5-18.css?v=5.18.0">
</head>
<body class="tkn-print-layout">
  <main class="receipt-page">
    <section class="toolbar no-print">
      <div>
        <strong>พิมพ์ใบเสร็จย้อนหลัง</strong>
        <span id="toolbarStatus">กำลังโหลด...</span>
      </div>
      <div class="toolbar-actions">
        <label>
          ขนาดกระดาษ
          <select id="paperSize">
            <option value="80">80 mm</option>
            <option value="58">58 mm</option>
          </select>
        </label>
        <button id="printButton" type="button" disabled>พิมพ์</button>
        <button id="closeButton" type="button">ปิด</button>
      </div>
    </section>

    <article id="receipt" class="receipt receipt-80" aria-live="polite">
      <p class="receipt-loading">กำลังโหลดใบเสร็จ...</p>
    </article>
  </main>

  
  <script src="./js/receipt-qr-safe.js?v=3.4.9"></script>
  <script type="module" src="./js/phase-9-2-reprint-receipt.js?v=5.16.2"></script>
<script src="./js/vendor/tkn-qrcode-local-v5.16.4.js?v=5.16.4"></script><script src="./js/tkn-qr-health-v5.16.4.js?v=5.16.4"></script>
  <script src="./js/mobile-app-shell-v5-18.js?v=5.18.0" defer></script>
</body>
</html>

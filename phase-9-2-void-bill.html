<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TKN POS - ยกเลิกบิล</title>
  <link rel="stylesheet" href="./css/void-bill.css?v=5.31.28-HF7">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <!-- TKN Global Prompt Typography v4.7.0 -->
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="apple-touch-icon" href="./assets/icons/tkn-app-192.png">
  <link rel="manifest" href="./manifest.webmanifest?v=5.20.4">

  <link rel="stylesheet" href="./css/ui-modern-v5-19.css?v=5.19.0">
  <link rel="stylesheet" href="./css/app-shell-v5-19.css?v=5.20.4">
</head>
<body>
  <main class="page-shell">
    <section class="card">
      <header>
        <p class="eyebrow">TKN POS / ERP · Phase 9.2</p>
        <h1>ยกเลิกบิล</h1>
        <p id="billSummary">กำลังโหลดข้อมูลบิล...</p>
      </header>

      <div class="warning">
        <strong>คำเตือน</strong>
        <p>การยกเลิกบิลจะเปลี่ยนสถานะเป็น VOIDED และไม่สามารถยกเลิกซ้ำได้</p>
      </div>

      <label>
        เหตุผลการยกเลิก
        <textarea id="reason" rows="5"
          placeholder="ระบุเหตุผลอย่างน้อย 5 ตัวอักษร"></textarea>
      </label>

      <div class="actions">
        <button id="cancelButton" type="button" class="secondary">ยกเลิก</button>
        <button id="confirmButton" type="button" class="danger">ยืนยันยกเลิกบิล</button>
      </div>

      <p id="statusMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="voidApprovalDialog" class="approval-dialog">
    <div class="approval-card">
      <h2>ขออนุมัติยกเลิกบิล</h2>
      <p>
        บัญชีที่กำลังใช้งานไม่มีสิทธิ์ยกเลิกบิล กรุณาใส่รหัสพนักงาน
        และ PIN ของผู้ที่มีสิทธิ์ยกเลิกบิล
      </p>
      <form id="voidApprovalForm">
        <label>
          รหัสผู้อนุมัติ
          <input id="voidApproverCode" type="text" autocomplete="off" required>
        </label>
        <label>
          PIN
          <input id="voidApproverPin" type="password" inputmode="numeric" autocomplete="off" required>
        </label>
        <p id="voidApprovalMessage" role="status" aria-live="polite"></p>
        <div class="approval-actions">
          <button id="cancelVoidApproval" class="secondary" type="button">ยกเลิก</button>
          <button id="confirmVoidApproval" class="danger" type="submit">อนุมัติและยกเลิกบิล</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="./js/void-bill.js?v=5.31.28-HF7"></script>
  <script src="./js/app-shell-v5-19.js?v=5.20.4" defer></script>
</body>
</html>

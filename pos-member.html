<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ผูกสมาชิกกับบิลขาย</title>
  <link rel="stylesheet" href="./css/auth-stability.css?v=5.8.0">
  <link rel="stylesheet" href="./css/members.css?v=5.8.0">
  <link rel="stylesheet" href="./css/navigation.css?v=3.6.8">
  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
</head>
<body class="tkn-auth-loading" data-loading-text="กำลังตรวจสอบสิทธิ์ผูกสมาชิกกับบิล...">
<main class="shell">
  <header class="top">
    <div>
      <h1>ผูกสมาชิกกับบิลขาย</h1>
      <p>ผูกสมาชิกหลังชำระเงินเพื่อสะสมคะแนน</p>
      <p id="scopeText" class="scope-text"></p>
    </div>
    <a class="btn secondary" href="./dashboard.html">Dashboard</a>
  </header>

  <section class="card grid">
    <label class="field">เลขที่บิล<input id="saleNo" autocomplete="off"></label>
    <label class="field">เบอร์โทรสมาชิก<input id="phone" inputmode="tel" autocomplete="off"></label>
    <label class="field muted-field">คะแนนที่ต้องการใช้
      <input id="redeem" type="number" value="0" disabled>
      <small>ปิดใช้งานหลังชำระเงิน เพื่อให้ยอดรับเงินจริงตรงกับยอดบิล</small>
    </label>
    <button id="applyBtn" class="btn primary">ผูกสมาชิกและสะสมคะแนน</button>
    <p id="message" class="msg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=1.0.2"></script>
<script src="./js/auth-guard.js?v=5.8.0"></script>
<script src="./js/pos-member.js?v=5.8.0"></script>
<script src="./js/navigation-newtab-final.js?v=4.9.1-final"></script>
</body>
</html>

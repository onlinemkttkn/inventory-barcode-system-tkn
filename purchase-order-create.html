<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สร้างใบสั่งซื้อ</title>
<link rel="stylesheet" href="./css/purchase.css?v=1.0.2">
<link rel="stylesheet" href="./css/navigation.css?v=5.19.0">
  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <!-- TKN Global Prompt Typography v4.7.0 -->
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="apple-touch-icon" href="./assets/icons/tkn-app-192.png">
  <link rel="manifest" href="./manifest.webmanifest?v=5.20.4">

  <link rel="stylesheet" href="./css/ui-modern-v5-19.css?v=5.19.0">
  <link rel="stylesheet" href="./css/app-shell-v5-19.css?v=5.20.4">
  <link rel="stylesheet" href="./css/ui-refinement-v5-20-4.css?v=5.20.4">
  <link rel="stylesheet" href="./css/tkn-unified-scanner-v5-29-0.css?v=5.29.0">
</head>
<body>
<main class="shell">
<header class="top">
  <div><h1>สร้างใบสั่งซื้อ</h1><p>Purchase Order</p></div>
  <div class="row">
    <a class="btn secondary" href="./suppliers.html">ผู้จำหน่าย</a>
    <a class="btn secondary" href="./purchase-order-history.html">ประวัติ PO</a>
  </div>
</header>

<section class="card grid">
<label class="field">ผู้จำหน่าย<select id="supplier"></select></label>
<label class="field">สาขาที่รับสินค้า<select id="branch"></select></label>
<label class="field">วันที่สั่งซื้อ<input id="orderDate" type="date"></label>
<label class="field">กำหนดรับ<input id="expectedDate" type="date"></label>
<label class="field">เลขอ้างอิง<input id="referenceNo"></label>
<label class="field">ส่วนลดท้าย PO<input id="discount" type="number" min="0" step="0.01" value="0"></label>
<label class="field" style="grid-column:1/-1">หมายเหตุ<textarea id="notes"></textarea></label>
</section>

<section class="card">
<form id="searchForm" class="row">
<input id="search" data-tkn-scan="product" placeholder="ค้นหาชื่อสินค้า รหัส หรือบาร์โค้ด">
<button class="btn primary">ค้นหา</button>
</form>
<div id="results" class="items"></div>
<p id="searchMessage" class="msg"></p>
</section>

<section class="card">
<h2>รายการสั่งซื้อ</h2>
<div id="cart" class="items"></div>
<div class="summary">
<div><span>ยอดก่อน VAT</span><strong id="subtotal">฿0.00</strong></div>
<div><span>VAT</span><strong id="vat">฿0.00</strong></div>
<div><span>ส่วนลดท้าย PO</span><strong id="discountTotal">฿0.00</strong></div>
<div><span>ยอดรวม</span><strong id="grandTotal">฿0.00</strong></div>
</div>
<button id="saveBtn" class="btn success">บันทึก PO</button>
<p id="actionMessage" class="msg"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=1.0.2"></script>
<script src="./js/purchase-order-create.js?v=1.0.2"></script>
<script src="./js/tkn-safe-back.js?v=5.19.0"></script>
  <script src="./js/app-shell-v5-19.js?v=5.29.0" defer></script>
  <script src="./js/ui-refinement-v5-20-4.js?v=5.20.4" defer></script>
<script src="./js/tkn-unified-scanner-v5-29-0.js?v=5.29.0"></script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ประวัติการขาย</title>
  <link rel="stylesheet" href="./css/pos.css?v=1.0.2">
  <link rel="stylesheet" href="./css/navigation.css?v=5.19.0">
  <link rel="icon" href="./assets/icons/favicon.svg?v=1.0.2">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.8">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.8">
  <!-- TKN Global Prompt Typography v4.7.0 -->
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="apple-touch-icon" href="./assets/icons/tkn-app-192.png">
  <link rel="manifest" href="./manifest.webmanifest?v=5.19.0">

  <link rel="stylesheet" href="./css/ui-modern-v5-19.css?v=5.19.0">
  <link rel="stylesheet" href="./css/app-shell-v5-19.css?v=5.19.0">
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>ประวัติการขาย</h1>
      <p>ร้านเถ้าแก่น้อยชลบุรี</p>
    </div>
    <div class="row">
      <a class="btn secondary" href="./dashboard.html">Dashboard</a>
      <a class="btn primary" href="./pos.html">ขายสินค้า</a>
    </div>
  </header>

  <section class="card grid">
    <label>สาขา
      <select id="branch">
        <option value="">ทุกสาขา</option>
      </select>
    </label>
    <label>สถานะ
      <select id="status">
        <option value="">ทั้งหมด</option>
        <option value="COMPLETED">สำเร็จ</option>
        <option value="VOIDED">ยกเลิก</option>
      </select>
    </label>
    <label>ค้นหา
      <input id="search" placeholder="เลขขาย ลูกค้า หรือผู้ขาย">
    </label>
    <button id="refresh" class="btn primary">โหลดข้อมูล</button>
  </section>

  <section class="card wrap">
    <table>
      <thead>
        <tr>
          <th>วันที่</th>
          <th>เลขที่ขาย</th>
          <th>สาขา</th>
          <th>สถานะ</th>
          <th>รายการ</th>
          <th>จำนวน</th>
          <th>ยอดสุทธิ</th>
          <th>ชำระ</th>
          <th>พนักงาน</th><th>ใบเสร็จ</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <p id="message" class="msg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=1.0.2"></script>
<script src="./js/sales-history.js?v=1.0.2"></script>
  <script src="./js/tkn-safe-back.js?v=5.19.0"></script>
  <script src="./js/app-shell-v5-19.js?v=5.19.0" defer></script>
</body>
</html>

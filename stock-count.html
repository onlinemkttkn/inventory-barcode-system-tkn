<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ตรวจนับสต็อก</title>
  <link rel="stylesheet" href="./css/stock-count.css?v=3.6.9">
  <link rel="stylesheet" href="./css/navigation.css?v=5.19.0">
  <link rel="stylesheet" href="./css/theme-red-yellow-black.css?v=3.6.9">
  <link rel="stylesheet" href="./css/responsive-no-scroll.css?v=3.6.9">
  <link rel="icon" href="./assets/icons/favicon.svg?v=3.6.9">
  <link rel="stylesheet" href="./css/auth-stability.css?v=3.6.11">
  <link rel="stylesheet" href="./css/inventory-workspace.css?v=5.0.0">
  <link rel="stylesheet" href="./css/inventory-final-ui.css?v=1.0.0">
  <!-- TKN Global Prompt Typography v4.7.0 -->
  <link rel="stylesheet" href="css/global-font.css?v=4.7.0">
  <meta name="theme-color" content="#c8101e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เถ้าแก่น้อย ชลบุรี">
  <link rel="apple-touch-icon" href="./assets/icons/tkn-app-192.png">
  <link rel="manifest" href="./manifest.webmanifest?v=5.19.0">

  <link rel="stylesheet" href="./css/ui-modern-v5-19.css?v=5.19.0">
  <link rel="stylesheet" href="./css/app-shell-v5-19.css?v=5.19.0">
</head>
<body class="tkn-auth-loading" data-inventory-page="count" data-loading-text="กำลังเปิดคลังสินค้า...">
<main class="shell">
  <header class="top">
    <div>
      <p class="eyebrow">PHASE 07.6E · SAFE STOCK COUNT</p>
      <h1>ตรวจนับสต็อกด้วยมือถือ</h1>
      <p>ระบบจะไม่เขียนทับ หากสต็อกเปลี่ยนระหว่างการตรวจนับ</p>
    </div>
    <a class="btn secondary" href="./dashboard.html">Dashboard</a>
  </header>

  <section class="card grid">
    <label>สาขา<select id="branch"></select></label>
    <label>หมายเหตุ<textarea id="notes" rows="2"></textarea></label>
    <button id="start" class="btn primary" type="button">เริ่มรอบตรวจนับ</button>
    <div><b id="sessionText">ยังไม่ได้เริ่มรอบ</b></div>
  </section>

  <section class="card">
    <form id="searchForm" class="row">
      <input id="search" placeholder="ชื่อสินค้า รหัส หรือบาร์โค้ด" autocomplete="off">
      <button class="btn primary" type="submit">ค้นหา</button>
    </form>
    <div id="results" class="items"></div>
    <p id="searchMsg" class="msg"></p>
  </section>

  <section class="card">
    <h2>รายการที่นับ</h2>
    <div id="counted" class="items"></div>
    <div class="row"><button id="complete" class="btn success" type="button">ยืนยันและปรับยอดสต็อก</button><button id="cancel" class="btn danger" type="button">ยกเลิกรอบ</button></div>
    <p id="actionMsg" class="msg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=3.6.9"></script>
<script src="./js/auth-guard.js?v=3.6.11"></script>
<script src="./js/inventory-workspace.js?v=5.0.0"></script>
<script src="./js/stock-count-common.js?v=3.6.11"></script>
<script src="./js/stock-count.js?v=5.0.0"></script>
<script src="./js/tkn-safe-back.js?v=5.19.0"></script>
  <script src="./js/app-shell-v5-19.js?v=5.19.0" defer></script>
</body>
</html>
